<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout Chat</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="frame">
    <aside class="rooms" aria-label="Rooms">
      <header class="brand">
        <span class="name" tabindex="-1">Scout Chat</span>
        <span class="host" id="host"></span>
      </header>
      <div class="index-scroll">
        <nav id="room-list" aria-label="Conversations">
          <section class="group" id="channels" hidden><h2>Channels</h2><div></div></section>
          <section class="group" id="direct" hidden><h2>Direct</h2><div></div></section>
        </nav>
        <div id="index-empty"></div>
      </div>
      <section class="integration-actions" aria-labelledby="connections-title">
        <h2 id="connections-title">Connections</h2>
        <button type="button" class="integration-button" data-integration="board">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>
          Add a Vercel Board
        </button>
        <button type="button" class="integration-button" data-integration="slack">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>
          Add Slack
        </button>
      </section>
      <footer class="note" id="status"></footer>
    </aside>
    <main class="room" id="room">
      <div class="empty" id="empty">
        <h1 class="lede" id="empty-title">Loading rooms…</h1>
        <p id="empty-detail"></p>
        <button class="action" id="first-ask" type="button" hidden>Ask an agent</button>
        <div id="recovery" hidden>
          <p id="connection-status" role="status"></p>
          <div class="setup" hidden>
            <code id="setup-command">npx github:openscout-app/chat setup</code>
            <button class="action" type="button" id="copy">Copy</button>
          </div>
          <button class="action" type="button" id="check">Check again</button>
        </div>
      </div>
      <section id="conversation" hidden>
        <header class="room-head">
          <a class="rooms-back" href="/">Rooms</a>
          <h1 tabindex="-1"></h1><span class="sub"></span>
        </header>
        <div class="log" tabindex="0" role="region" aria-label="Messages">
          <p id="log-note" class="quiet" role="status" hidden></p>
          <div id="messages"></div>
        </div>
        <div id="room-composer"></div>
      </section>
    </main>
  </div>
  <dialog class="integration-panel" id="ask-panel" aria-labelledby="ask-title">
    <header class="integration-heading">
      <h2 id="ask-title">Ask an agent</h2>
      <form method="dialog"><button class="action" type="submit">Close</button></form>
    </header>
    <label>Agent<select id="ask-target"></select></label>
    <div id="ask-composer"></div>
  </dialog>
  <dialog class="integration-panel" id="connections-panel" aria-labelledby="integration-title">
    <header class="integration-heading">
      <h2 id="integration-title" tabindex="-1"></h2>
      <form method="dialog">
        <button class="integration-button" type="submit" aria-label="Close connection panel">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>
        </button>
      </form>
    </header>
    <p id="integration-capability" role="status"></p>
    <form id="integration-form" method="post" hidden autocomplete="off">
      <div id="integration-fields"></div>
      <button class="integration-button primary" type="submit">Connect</button>
    </form>
    <p id="integration-result" role="status" tabindex="-1"></p>
    <ol id="integration-steps" hidden></ol>
  </dialog>
</body>
</html>
